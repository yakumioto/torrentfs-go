# Native SMB: no FUSE device, Samba, SYS_ADMIN, or low-port capability.
# Set TORRENTFS_PASSWORD in a private .env file and choose a published image tag.
# Create ./torrents with the UID/GID below, or inspect existing ownership first.
# Defaults expose HTTP/SMB on host loopback only. To use a LAN player, set
# TF_BIND_ADDRESS to this host's trusted LAN IP and use firewall rules.
#   docker compose up -d
#   docker compose logs -f torrentfs
services:
  torrentfs:
    image: ghcr.io/yakumioto/torrentfs-go:REPLACE_WITH_PUBLISHED_TAG
    user: "${PUID:-1000}:${PGID:-1000}"
    restart: unless-stopped
    stop_grace_period: 60s
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    ports:
      - "${TF_BIND_ADDRESS:-127.0.0.1}:445:1445/tcp"
      - "${TF_BIND_ADDRESS:-127.0.0.1}:8080:8080/tcp"
      - "6881:6881/tcp"
      - "6881:6881/udp"
    volumes:
      - type: bind
        source: ./torrents
        target: /torrents
        bind:
          create_host_path: false
      # Optional custom TOML; backend can also be selected there.
      # Remove the corresponding environment override below when using TOML.
      # - ./torrentfs.toml:/etc/torrentfs/torrentfs.toml:ro
    environment:
      PUID: "${PUID:-1000}"
      PGID: "${PGID:-1000}"
      TORRENTFS_BACKEND: "smb"
      TORRENTFS_SMB_LISTEN_ADDR: "0.0.0.0:1445"
      TORRENTFS_HTTP_LISTEN_ADDR: "0.0.0.0:8080"
      TORRENTFS_HTTP_AUTH_ENABLED: "true"
      # One credential pair serves the SMB login and the HTTP login. The HTTP
      # login checks the password only.
      TORRENTFS_USERNAME: "torrentfs"
      # Environment secrets remain visible to Docker administrators. Keep the
      # password in a private .env file rather than in this template.
      TORRENTFS_PASSWORD: "${TORRENTFS_PASSWORD:?set a strong shared HTTP/SMB password}"
      # Optional STRM share; the URL must be reachable from the player.
      # TORRENTFS_STRM_BASE_URL: "http://192.168.1.10:8080"
      TORRENTFS_CONNECTIONS_LISTEN_PORT: "6881"
      TORRENTFS_CACHE_CAPACITY: "2GiB"
      TORRENTFS_FILESYSTEM_READ_TIMEOUT: "30s"
