# torrentfs.example.toml — copy and adjust for a torrentfs startup.
#
# One existing torrents directory remains a required command-line input.
# mountpoint is required unless the HTTP API is enabled (http.listen_addr).
# Configuration is loaded on every startup; an explicit -data-dir flag
# overrides paths.data_dir.
#
# The FUSE mount exposes torrent data only, read-only. Torrent management
# (add, delete, status) happens over the HTTP API below; there is no
# metadata/ or stats/ control directory in the mount.

[paths]
# Writable directory for downloaded payload data.
# The required positional torrents directory stores .metadata separately.
# Omitting this key uses <user cache dir>/torrentfs.
data_dir = "./torrentfs-data"
# Managed root for per-torrent payload directories. Each torrent owns
# <payload_dir>/<info_hash>, which is the only directory ever purged when a
# deletion requests purge_data=true. Empty uses <data_dir>/payload.
payload_dir = ""

[http]
# Address of the torrent management API. Empty disables the service. The
# default binds loopback only; exposing it requires a bearer_token.
listen_addr = "127.0.0.1:8080"
# When non-empty, every request must send Authorization: Bearer <token>.
bearer_token = ""
# Maximum size of an uploaded .torrent request body, in bytes (10 MiB default).
max_upload_bytes = 10485760

[connections]
# Empty listens on all suitable local interfaces.
listen_host = ""
# 0 selects an available port.
listen_port = 0

[proxy]
# Empty disables SOCKS5. Use socks5:// or socks5h://, optionally with auth.
socks5_url = ""

[cache]
# Maximum in-memory piece cache size, in bytes (64 MiB by default).
capacity_bytes = 67108864

[identity]
# User-Agent for HTTP tracker announces. Explicit empty values use the anacrolix default.
tracker_user_agent = "qBittorrent/4.4.0"
# Prefix of the generated 20-byte peer ID, measured in bytes.
# The remaining bytes are random for each session.
peer_id_prefix = "-qB4400-"
# BEP 10 extended handshake v value.
extended_handshake_client_version = "qBittorrent/4.4.0"
