# torrentfs.example.toml — copy and adjust for a torrentfs startup.
#
# mountpoint remains a required command-line flag. Configuration is loaded on
# every startup; an explicit -data-dir flag overrides paths.data_dir.

[paths]
# Writable directory for downloaded data and the metadata sidecar.
# Omitting this key uses <user cache dir>/torrentfs.
data_dir = "./torrentfs-data"

[connections]
# Empty listens on all suitable local interfaces.
listen_host = ""
# 0 selects an available port.
listen_port = 0

[proxy]
# Empty disables SOCKS5. Use socks5:// or socks5h://, optionally with auth.
socks5_url = ""

[cache]
# Maximum in-memory piece cache size, in bytes (64 MiB by default).
capacity_bytes = 67108864

[identity]
# User-Agent for HTTP tracker announces; empty inherits the client default.
tracker_user_agent = ""
# Prefix of the generated 20-byte peer ID, measured in bytes; empty inherits the client default.
# The remaining bytes are random for each session.
peer_id_prefix = ""
# BEP 10 extended handshake v value; empty inherits the client default.
extended_handshake_client_version = ""
