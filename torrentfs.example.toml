# torrentfs.example.toml — example configuration for torrentfs.
#
# This file is a placeholder: torrentfs does not read a TOML configuration
# yet. The paths/connections sections below are defined in the in-code config
# model (M1), and loading a file like this one lands in M4.
#
# The commented sections below sketch the intended shape for upcoming
# milestones. Keys may change — treat them as a record of direction, not a
# contract.

# [paths]
#   # Filesystem paths torrentfs manages at runtime
#   # (session data, cache, mountpoint helpers, ...).
#   data_dir = "<user cache dir>/torrentfs"

# [connections]
#   # Settings for the torrent session and FUSE mount
#   # (listen ports, cache limits, mount options, ...).
#   listen_host = ""
#   listen_port = 0
