name: Nightly

on:
  # GitHub Actions cron uses UTC: 16:17 UTC is 00:17 the next day in Beijing.
  schedule:
    - cron: "17 16 * * *"
  workflow_dispatch:

permissions: {}

concurrency:
  group: torrentfs-nightly-main
  cancel-in-progress: false

jobs:
  guard:
    name: Verify trusted main source
    if: ${{ github.repository == 'yakumioto/torrentfs-go' && github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-latest
    permissions: {}
    steps:
      - name: Confirm repository and ref
        run: |
          set -euo pipefail
          test "${GITHUB_REPOSITORY}" = "yakumioto/torrentfs-go"
          test "${GITHUB_REF}" = "refs/heads/main"

  test:
    name: build, vet, unit and race tests
    needs: guard
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
          persist-credentials: false
      - uses: ./.github/actions/go-quality
        with:
          mode: test

  lint:
    name: golangci-lint
    needs: guard
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
          persist-credentials: false
      - uses: ./.github/actions/go-quality
        with:
          mode: lint

  fuse:
    name: real FUSE mount tests (required)
    needs: guard
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
    env:
      TORRENTFS_FUSE_REQUIRED: "1"
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
          persist-credentials: false
      - uses: ./.github/actions/go-quality
        with:
          mode: fuse

  image:
    name: Build, validate, and publish nightly image
    needs: [guard, test, lint, fuse]
    if: ${{ needs.guard.result == 'success' && needs.test.result == 'success' && needs.lint.result == 'success' && needs.fuse.result == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 90
    permissions:
      contents: read
      packages: write
    env:
      IMAGE_REPOSITORY: ghcr.io/yakumioto/torrentfs-go
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
          persist-credentials: false

      - name: Derive immutable nightly identity
        id: metadata
        shell: bash
        env:
          COMMIT: ${{ github.sha }}
          RUN_ID: ${{ github.run_id }}
        run: |
          set -Eeuo pipefail
          : "${COMMIT:?COMMIT is required}"
          : "${RUN_ID:?RUN_ID is required}"
          if [[ ! "$COMMIT" =~ ^[0-9a-f]{40}$ ]]; then
            printf 'Unexpected event SHA: %s\n' "$COMMIT" >&2
            exit 1
          fi
          if [[ ! "$RUN_ID" =~ ^[0-9]+$ ]]; then
            printf 'Unexpected workflow run ID: %s\n' "$RUN_ID" >&2
            exit 1
          fi
          [[ "$(git rev-parse HEAD)" == "$COMMIT" ]]
          commit_timestamp="$(git show -s --format=%cI "$COMMIT")"
          date_utc="$(date -u -d "$commit_timestamp" +%Y%m%d)"
          created="$(date -u -d "$commit_timestamp" +%Y-%m-%dT%H:%M:%SZ)"
          tag="nightly-${date_utc}-${COMMIT:0:7}-${RUN_ID}"
          printf 'date=%s\n' "$date_utc" >> "$GITHUB_OUTPUT"
          printf 'created=%s\n' "$created" >> "$GITHUB_OUTPUT"
          printf 'tag=%s\n' "$tag" >> "$GITHUB_OUTPUT"
          printf 'amd64_tag=torrentfs-nightly-validation:%s-amd64\n' "$tag" >> "$GITHUB_OUTPUT"
          printf 'arm64_tag=torrentfs-nightly-validation:%s-arm64\n' "$tag" >> "$GITHUB_OUTPUT"

      - name: Set up QEMU
        uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4
        with:
          platforms: arm64

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4

      - name: Build Linux amd64 validation image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64
          tags: ${{ steps.metadata.outputs.amd64_tag }}
          load: true
          provenance: false
          sbom: false
          labels: |
            org.opencontainers.image.created=${{ steps.metadata.outputs.created }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.version=${{ steps.metadata.outputs.tag }}
            org.opencontainers.image.ref.name=${{ steps.metadata.outputs.tag }}

      - name: Inspect and start Linux amd64 validation image
        shell: bash
        env:
          IMAGE: ${{ steps.metadata.outputs.amd64_tag }}
          EXPECTED_CREATED: ${{ steps.metadata.outputs.created }}
          EXPECTED_TAG: ${{ steps.metadata.outputs.tag }}
          EXPECTED_SHA: ${{ github.sha }}
        run: |
          set -Eeuo pipefail
          test "$(docker image inspect "$IMAGE" --format '{{.Os}}/{{.Architecture}}')" = "linux/amd64"
          test "$(docker image inspect "$IMAGE" --format '{{index .Config.Labels "org.opencontainers.image.created"}}')" = "$EXPECTED_CREATED"
          test "$(docker image inspect "$IMAGE" --format '{{index .Config.Labels "org.opencontainers.image.revision"}}')" = "$EXPECTED_SHA"
          test "$(docker image inspect "$IMAGE" --format '{{index .Config.Labels "org.opencontainers.image.version"}}')" = "$EXPECTED_TAG"
          docker run --rm --platform linux/amd64 "$IMAGE" -h >/dev/null

      - name: Build Linux arm64 validation image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/arm64
          tags: ${{ steps.metadata.outputs.arm64_tag }}
          load: true
          provenance: false
          sbom: false
          labels: |
            org.opencontainers.image.created=${{ steps.metadata.outputs.created }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.version=${{ steps.metadata.outputs.tag }}
            org.opencontainers.image.ref.name=${{ steps.metadata.outputs.tag }}

      - name: Inspect and start Linux arm64 validation image
        shell: bash
        env:
          IMAGE: ${{ steps.metadata.outputs.arm64_tag }}
          EXPECTED_CREATED: ${{ steps.metadata.outputs.created }}
          EXPECTED_TAG: ${{ steps.metadata.outputs.tag }}
          EXPECTED_SHA: ${{ github.sha }}
        run: |
          set -Eeuo pipefail
          test "$(docker image inspect "$IMAGE" --format '{{.Os}}/{{.Architecture}}')" = "linux/arm64"
          test "$(docker image inspect "$IMAGE" --format '{{index .Config.Labels "org.opencontainers.image.created"}}')" = "$EXPECTED_CREATED"
          test "$(docker image inspect "$IMAGE" --format '{{index .Config.Labels "org.opencontainers.image.revision"}}')" = "$EXPECTED_SHA"
          test "$(docker image inspect "$IMAGE" --format '{{index .Config.Labels "org.opencontainers.image.version"}}')" = "$EXPECTED_TAG"
          docker run --rm --platform linux/arm64 "$IMAGE" -h >/dev/null

      - name: Log in to GHCR after validation
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push nightly multi-platform image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ${{ env.IMAGE_REPOSITORY }}:${{ steps.metadata.outputs.tag }}
          provenance: false
          sbom: false
          labels: |
            org.opencontainers.image.created=${{ steps.metadata.outputs.created }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.version=${{ steps.metadata.outputs.tag }}
            org.opencontainers.image.ref.name=${{ steps.metadata.outputs.tag }}
