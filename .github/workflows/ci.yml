name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  # Everything that runs without a FUSE device. FUSE-dependent tests skip
  # themselves here with a printed reason; the fuse job below requires them.
  test:
    name: build, vet, unit and race tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: ./.github/actions/go-quality
        with:
          mode: test

  lint:
    name: golangci-lint
    runs-on: ubuntu-latest
    env:
      GOLANGCI_LINT_VERSION: v2.12.2
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      # Build golangci-lint with this job's Go toolchain instead of downloading
      # a prebuilt release. golangci-lint refuses to load a module whose `go`
      # directive is newer than the Go that built the binary, and release
      # binaries can lag behind. Building from source keeps the two in step.
      - uses: ./.github/actions/go-quality
        with:
          mode: lint
          golangci-lint-version: ${{ env.GOLANGCI_LINT_VERSION }}

  docker-config:
    name: Docker default and environment configuration smoke
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Run Docker configuration smoke
        run: ./scripts/docker-config-smoke.sh

  # SMB mode is optional and off by default, so this job exercises the real
  # single-container path: FUSE mount, authenticated read-only share, guest and
  # write denial, bounded SIGTERM order, and failure propagation. The script
  # reports it explicitly when the host kernel cannot mount CIFS at all; the
  # FUSE large-offset test above remains the required random-read gate there,
  # and a host that can mount CIFS must also pass the ranged comparison.
  docker-smb:
    name: Docker single-container SMB smoke
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Run single-container SMB smoke
        run: ./scripts/docker-smb-smoke.sh

  # Real-mount job. It sets TORRENTFS_FUSE_REQUIRED=1, so a runner without
  # /dev/fuse, fusermount, or mount permission fails instead of silently
  # skipping every real-mount test.
  fuse:
    name: real FUSE mount tests (required)
    runs-on: ubuntu-latest
    env:
      TORRENTFS_FUSE_REQUIRED: "1"
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: ./.github/actions/go-quality
        with:
          mode: fuse
