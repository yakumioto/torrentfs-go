# Default configuration for the Docker image.
# Only documented environment variable names are read; there is no automatic
# environment mapping for every TOML leaf. TORRENTFS_USERNAME and
# TORRENTFS_PASSWORD are special shared HTTP/SMB credentials.

[http]
listen_addr = "127.0.0.1:8080"
max_upload_bytes = 10485760

[http.auth]
enabled = false
username = ""
password_hash = ""
password_hash_file = ""
token_ttl = "30m"

[connections]
listen_host = ""
# A fixed peer port so it can be published with -p 6881:6881/tcp -p 6881:6881/udp.
# Inbound peers are unreachable from a bridge network without that mapping.
listen_port = 6881
# Image default: no IPv6 in the container network.
disable_ipv6 = true
# No automatic UPnP/NAT-PMP mapping; publish the port yourself when needed.
no_port_forwarding = true
bootstrap_nodes = []

[proxy]
socks5_url = ""

[upload]
# Aggregate peer payload upload rate in bytes per second, summed over all
# torrents and peers. 0 keeps the image unlimited. HTTP request bodies are
# capped separately by http.max_upload_bytes.
rate_limit_bytes_per_second = 0

[upload.schedule]
# Optional daily window in the process-local time zone, 24-hour HH:MM, half-open
# [start, end); outside it uploads are unlimited. Both bounds must be set
# together and start must be before end. The image's zone is usually UTC.
start = ""
end = ""

[cache]
# 2 GiB suits a host with about 4 GB of RAM. Override for smaller containers:
# set this to roughly 50-60% of the container memory limit.
capacity_bytes = 2147483648

[identity]
tracker_user_agent = "qBittorrent/4.4.0"
peer_id_prefix = "-qB4400-"
extended_handshake_client_version = "qBittorrent/4.4.0"

[log]
level = "info"
format = "text"
add_source = false

[mount]
# Non-root deployments should leave this false unless /etc/fuse.conf contains
# user_allow_other and the wider read access is intentional.
allow_other = false
