# torrentfs.toml — the configuration of the Docker image.
#
# The image holds the settings that differ from the built-in defaults.
# Everything else keeps its built-in value; this is not a complete
# configuration. The complete one is torrentfs.example.toml.
#
# Override a value with the environment variable of its path, or with a
# configuration file of your own mounted over this one.

[connections]
# ListenPort is the TCP/UDP port for incoming peer connections.
# 0 selects a random free port.
listen_port = 6881
# DisableIPv6 turns off every IPv6 listener, dialer, and DHT server.
# Only one family may be disabled: disabling both leaves no transport.
disable_ipv6 = true
